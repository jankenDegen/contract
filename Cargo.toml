[package]
name = "jankendegen"
version = "0.1.0"
edition = "2021"

[lib]
name = "jankendegen"
crate-type = ["cdylib"]

# Pin the Solana CLI image used by solana-verify. The program depends on
# solana-system-interface 3.2+, which requires the newer SBF Rust toolchain.
[workspace.metadata.cli]
solana = "4.0.3"

[features]
default = []
no-entrypoint = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(target_os, values("solana"))',
  'cfg(target_feature, values("static-syscalls"))',
  'cfg(feature, values("custom-heap", "custom-panic"))',
] }

[dependencies]
solana-program = "3.0.0"
solana-system-interface = { version = "3.2.0", features = ["bincode"] }
borsh = "1.5.1"
borsh-derive = "1.5.1"
thiserror = "1.0.24"
solana-security-txt = "1.1.1"
